<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <title id="title">함수쌤클라쓰</title>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/sidebar.css" />
  <link rel="stylesheet" href="css/table.css" />
  <link rel="stylesheet" href="css/main.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <!-- HTML -->
  <div class="body-container">
    <!-- 좌측: 반 목록 -->
    <aside class="sidebar">
      <div id="sidebarLogo" class="sidebar-logo">함수쌤클라쓰</div>
      <div class="teacher-selector">
        <select id="teacherSelect"></select> 강사
      </div>
      <div class="sidebar-container">
        <div class="sidebar-list">
          <div class="sidebar-block" onclick="openMenu('timetable')">시간표</div>
          <div class="sidebar-block" onclick="openMenu('calender')">달력/todo</div>
          <div class="sidebar-block" onclick="openMenu('diary')">다이어리</div>
        </div>
      </div>
      <div class="sidebar-container">
        <div class="sidebar-header">
          <span>반 목록</span>
          <div class="button-sm">추가</div>
        </div>
        <div id="groupList" class="sidebar-list">
          <div class="sidebar-block">GROUP LOADING...</div>
        </div>
      </div>
      <div class="sidebar-container">
        <div class="sidebar-header">데이터베이스</div>
        <div class="sidebar-list">
          <div class="sidebar-block" onclick="App.ui.navigation.openMenu('db')">DB 전체 보기</div>
          <div class="sidebar-block" onclick="App.db.backupDB()">DB 저장하기</div>
          <div class="sidebar-block" onclick="App.db.restoreDB()">DB 불러오기</div>
          <div class="sidebar-block" onclick="App.db.createNewDB()">DB 초기화</div>
        </div>
      </div>
    </aside>

    <!-- 우측 -->
    <main class="main">
      <!-- 최상단 바 -->
      <div class="globalbar">
        <div class="globalbar-title">
          <span id="selected-group"></span>
          <span id="selected-tab"></span>
        </div>
      </div>
      <!-- 두번째 바 -->
      <div id="localbar" class="localbar">
        <!-- <div class="localbar-tab" onclick="App.ui.navigation.openGroupTab(###)">###</div> -->
      </div>
      <!-- 메인 화면 -->
      <div class="scroll-wrap no-scrollbar">
        <section id="tabContent" class="tab-content"></section>
      </div>
    </main>
  </div>

  <!-- 0. SQL -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>  

  <!-- 1. App 네임스페이스 -->
  <script src="js/app.js"></script>

  <!-- 2. utils -->
  <script src="js/utils/date.js"></script>
  <script src="js/utils/constants.js"></script>
  <script src="js/utils/logger.js"></script>
  <script src="js/utils/text.js"></script>

  <!-- 3. state -->
  <script src="js/state/appState.js"></script>

  <!-- 4. db -->
  <script src="js/db/schema.js"></script>
  <script src="js/db/db.js"></script>
  <script src="js/db/columns.js"></script>

  <!-- 5. repositories -->
  <!-- <script src="js/repositories/groupRepo.js"></script>
  <script src="js/repositories/teacherRepo.js"></script>
  <script src="js/repositories/studentRepo.js"></script>
  <script src="js/repositories/scheduleRepo.js"></script>
  <script src="js/repositories/planRepo.js"></script>
  <script src="js/repositories/examRepo.js"></script>
  <script src="js/repositories/attendanceRepo.js"></script> -->

  <!-- 6. services -->
  <script src="js/services/groupService.js"></script>
  <script src="js/services/scoreService.js"></script>
  <!-- <script src="js/services/planService.js"></script>
  <script src="js/services/examService.js"></script>
  <script src="js/services/changeLogService.js"></script> -->

  <!-- 7. ui -->
  <script src="js/ui/tableEditor.js"></script>
  <script src="js/ui/navigation.js"></script>
  <script src="js/ui/sidebarUI.js"></script>
  <script src="js/ui/groupUI.js"></script>
  <script src="js/ui/planUI.js"></script>
  <script src="js/ui/scoreUI.js"></script>
  <!-- <script src="js/ui/events.js"></script>
  <script src="js/ui/examUI.js"></script>
  -->

  <!-- 8. entry -->
  <script src="js/main.js"></script>


</body>
</html>
